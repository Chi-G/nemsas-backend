services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemsas-backend
    ports:
      - "${DEPLOY_PORT:-9000}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-default}
      - EMAIL_HOST=${EMAIL_HOST:-sandbox.smtp.mailtrap.io}
      - EMAIL_PORT=${EMAIL_PORT:-2525}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nemsas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: nemsas-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nemsas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nemsas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nemsas-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  nemsas-network:
    driver: bridge
